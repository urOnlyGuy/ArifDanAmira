<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jemputan Walimatulurus - Arif & Amira | 11 Nov 2026</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"Montserrat"', 'sans-serif'],
          },
          colors: {
            ivory: '#F9F5F4',
            burgundy: {
              light: '#9E4757',
              DEFAULT: '#722F37',
              dark: '#4A1D23',
              deep: '#2D1115',
            },
            gold: {
              100: '#FDF7EB',
              300: '#E7C887',
              DEFAULT: '#C5A059',
              dark: '#9A7730',
            }
          },
          boxShadow: {
            'glow': '0 0 20px rgba(197, 160, 89, 0.4)',
            'floating': '0 8px 30px rgba(0, 0, 0, 0.4)',
            'glass': '0 4px 30px rgba(0, 0, 0, 0.1)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #2D1115;
      color: #F9F5F4;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    
    .gold-gradient-text {
      background: linear-gradient(135deg, #E7C887 0%, #C5A059 50%, #9A7730 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-press {
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s, border-color 0.3s;
    }
    .btn-press:active {
      transform: scale(0.96);
    }

    .modal-backdrop {
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    /* Bubbly Gradient Background Animations */
    @keyframes moveBubble1 {
      0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
      33% { transform: translate(30px, -50px) scale(1.1); opacity: 0.6; }
      66% { transform: translate(-20px, 20px) scale(0.9); opacity: 0.3; }
      100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
    }
    @keyframes moveBubble2 {
      0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      50% { transform: translate(-40px, -40px) scale(1.2); opacity: 0.7; }
      100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
    }
    @keyframes moveBubble3 {
      0% { transform: translate(0, 0) scale(0.8); opacity: 0.5; }
      50% { transform: translate(40px, 60px) scale(1.1); opacity: 0.2; }
      100% { transform: translate(0, 0) scale(0.8); opacity: 0.5; }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .animated-bg {
      background: linear-gradient(-45deg, #2D1115, #4A1D23, #722F37, #2D1115);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      z-index: 0;
    }
    .bubble-1 {
      background: radial-gradient(circle, rgba(197, 160, 89, 0.4) 0%, transparent 70%);
      width: 350px; height: 350px;
      top: -10%; left: -20%;
      animation: moveBubble1 12s infinite ease-in-out;
    }
    .bubble-2 {
      background: radial-gradient(circle, rgba(158, 71, 87, 0.4) 0%, transparent 70%);
      width: 400px; height: 400px;
      bottom: 10%; right: -20%;
      animation: moveBubble2 15s infinite ease-in-out;
    }
    .bubble-3 {
      background: radial-gradient(circle, rgba(197, 160, 89, 0.3) 0%, transparent 70%);
      width: 300px; height: 300px;
      top: 40%; left: 30%;
      animation: moveBubble3 10s infinite ease-in-out;
    }
  </style>
</head>

<body class="font-sans antialiased min-h-screen relative flex justify-center selection:bg-gold-300 selection:text-burgundy-deep animated-bg">

  <!-- Background Bubbles -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
    <div class="bubble bubble-3"></div>
  </div>

  <main class="w-full max-w-md min-h-screen px-6 py-16 relative z-10 flex flex-col items-center">

    <header class="text-center w-full flex flex-col items-center mb-12">
      <div class="w-28 h-28 rounded-full p-1 bg-gradient-to-tr from-gold-dark via-gold to-gold-100 shadow-glow mb-6">
        <img 
          src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=400&q=80" 
          alt="Wedding Rings" 
          onerror="this.src='https://placehold.co/400x400/4A1D23/F9F5F4?text=A+%26+H'"
          class="w-full h-full object-cover rounded-full border-2 border-burgundy-deep"
        />
      </div>

      <h1 class="font-sans text-sm tracking-[0.3em] uppercase text-gold-300 mb-4 opacity-90">
        Jemputan Walimatulurus
      </h1>
      
      <h2 class="font-serif italic text-5xl sm:text-7xl font-medium text-ivory tracking-tight leading-none mb-6 drop-shadow-md">
        Arif & Amira
      </h2>
      
      <div class="flex items-center gap-4 text-ivory/80 mb-2">
        <div class="h-[1px] w-12 bg-gold/50"></div>
        <p class="font-serif text-2xl font-medium gold-gradient-text tracking-wide">11 November 2026</p>
        <div class="h-[1px] w-12 bg-gold/50"></div>
      </div>
    </header>

    <div class="w-full space-y-4 mb-24">
      <!-- RSVP Button -->
      <button onclick="openModal('rsvpModal')" class="btn-press w-full glass-panel text-ivory rounded-2xl p-5 hover:bg-white/10 group relative block">
        <div class="flex items-center justify-center w-full">
          <i class="fa-regular fa-envelope-open text-xl text-gold-300 mr-3"></i>
          <span class="font-serif text-xl font-medium tracking-wide">RSVP</span>
        </div>
      </button>

      <!-- Google Maps Button -->
      <a href="https://maps.app.goo.gl/GEobsXizDVLT4Siw7" target="_blank" rel="noopener noreferrer" class="btn-press w-full glass-panel text-ivory rounded-2xl p-5 hover:bg-white/10 group relative block">
        <div class="flex items-center justify-center w-full">
          <i class="fa-solid fa-location-dot text-xl text-gold-300 mr-3"></i>
          <span class="font-serif text-xl font-medium tracking-wide">Google Maps</span>
        </div>
      </a>

      <!-- Waze Button -->
      <a href="https://waze.com/ul/hw1p6unq3p" target="_blank" rel="noopener noreferrer" class="btn-press w-full glass-panel text-ivory rounded-2xl p-5 hover:bg-white/10 group relative block">
        <div class="flex items-center justify-center w-full">
          <i class="fa-brands fa-waze text-xl text-gold-300 mr-3"></i>
          <span class="font-serif text-xl font-medium tracking-wide">Waze</span>
        </div>
      </a>
    </div>

  </main>

  <!-- Bottom Left: Floating Music Toggle -->
  <button id="musicToggleBtn" onclick="toggleAudio()" class="fixed bottom-6 left-6 z-40 w-14 h-14 rounded-full bg-burgundy/80 backdrop-blur-md border border-gold/40 shadow-floating flex items-center justify-center text-ivory transition-transform hover:scale-105 active:scale-95 group">
    <i id="musicIcon" class="fa-solid fa-music text-xl"></i>
  </button>

  <!-- Bottom Right: Expandable WhatsApp FAB -->
  <div class="fixed bottom-6 right-6 z-40 flex flex-col-reverse items-end gap-3">
    <!-- Main WhatsApp Button -->
    <button onclick="toggleWaMenu()" class="w-14 h-14 rounded-full bg-[#25D366] shadow-floating flex items-center justify-center text-white transition-transform hover:scale-105 active:scale-95 relative z-50">
      <i id="waMainIcon" class="fa-brands fa-whatsapp text-2xl transition-transform duration-300"></i>
    </button>
    
    <!-- Expandable WhatsApp Links -->
    <div id="waMenu" class="flex flex-col items-end gap-3 transition-all duration-300 opacity-0 translate-y-8 pointer-events-none relative z-40">
      <a href="https://wa.me/60136788851" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 hover:-translate-x-1 transition-transform group">
        <span class="bg-ivory text-burgundy-deep px-3 py-1.5 rounded-lg text-sm font-serif font-bold shadow-md">Hajah Rohaiza</span>
        <div class="w-11 h-11 rounded-full bg-[#25D366] text-white flex items-center justify-center shadow-md group-hover:scale-110 transition-transform">
          <i class="fa-brands fa-whatsapp text-xl"></i>
        </div>
      </a>
      <a href="https://wa.me/60123425248" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 hover:-translate-x-1 transition-transform group">
        <span class="bg-ivory text-burgundy-deep px-3 py-1.5 rounded-lg text-sm font-serif font-bold shadow-md">Haji Saidinar</span>
        <div class="w-11 h-11 rounded-full bg-[#25D366] text-white flex items-center justify-center shadow-md group-hover:scale-110 transition-transform">
          <i class="fa-brands fa-whatsapp text-xl"></i>
        </div>
      </a>
      <a href="https://wa.me/60183228055" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 hover:-translate-x-1 transition-transform group">
        <span class="bg-ivory text-burgundy-deep px-3 py-1.5 rounded-lg text-sm font-serif font-bold shadow-md">Emir</span>
        <div class="w-11 h-11 rounded-full bg-[#25D366] text-white flex items-center justify-center shadow-md group-hover:scale-110 transition-transform">
          <i class="fa-brands fa-whatsapp text-xl"></i>
        </div>
      </a>
    </div>
  </div>

  <!-- RSVP Modal -->
  <div id="rsvpModal" class="fixed inset-0 z-50 hidden flex items-end sm:items-center justify-center modal-backdrop bg-black/60 p-0 sm:p-4 transition-opacity">
    <div class="bg-ivory w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto p-6 sm:p-8 shadow-2xl relative animate-in slide-in-from-bottom duration-300">
      
      <div class="flex justify-between items-center mb-6 pb-4 border-b border-burgundy/10">
        <div>
          <h2 class="font-serif text-3xl font-bold text-burgundy-deep">RSVP</h2>
          <p class="text-xs text-burgundy-light font-sans mt-1 uppercase tracking-widest">Kindly reply to confirm</p>
        </div>
        <button type="button" onclick="closeModal('rsvpModal')" class="w-8 h-8 rounded-full bg-burgundy/10 text-burgundy-deep flex items-center justify-center hover:bg-burgundy hover:text-ivory transition-colors">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <form id="rsvpForm" onsubmit="handleRsvpSubmit(event)" class="space-y-5 text-burgundy-deep font-sans">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider mb-2">Guest Name(s) *</label>
          <input required type="text" id="guestName" placeholder="Enter your full name" class="w-full px-4 py-3 rounded-xl border border-burgundy/20 focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold bg-white text-sm shadow-inner">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider mb-2">Attendance *</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="flex items-center justify-center gap-2 p-3 border border-burgundy/20 rounded-xl cursor-pointer hover:bg-burgundy/5 has-[:checked]:border-burgundy has-[:checked]:bg-burgundy/10 transition-colors bg-white">
              <input type="radio" name="attendance" value="Accepts" checked class="accent-burgundy">
              <span class="text-sm font-medium">Attending</span>
            </label>
            <label class="flex items-center justify-center gap-2 p-3 border border-burgundy/20 rounded-xl cursor-pointer hover:bg-gray-100 has-[:checked]:border-gray-400 has-[:checked]:bg-gray-100 transition-colors bg-white">
              <input type="radio" name="attendance" value="Declines" class="accent-gray-600">
              <span class="text-sm font-medium">Unable</span>
            </label>
          </div>
        </div>
        
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider mb-2">Total Guests *</label>
          <select required id="guestCount" class="w-full px-4 py-3 rounded-xl border border-burgundy/20 focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold bg-white text-sm shadow-inner">
            <option value="1">1 Person</option>
            <option value="2">2 People</option>
            <option value="3">3 People</option>
            <option value="4">4 People</option>
            <option value="5">5 People</option>
          </select>
        </div>

        <button type="submit" class="w-full py-4 rounded-xl bg-burgundy-deep text-ivory font-serif text-xl tracking-wide hover:bg-burgundy transition-colors shadow-md mt-6 border border-burgundy-deep">
          Confirm RSVP
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] transform -translate-y-24 opacity-0 transition-all duration-300 pointer-events-none w-11/12 max-w-sm">
    <div class="bg-ivory text-burgundy-deep text-sm px-5 py-4 rounded-2xl shadow-2xl flex items-center gap-3 border-l-4 border-gold">
      <i class="fa-solid fa-circle-check text-gold text-xl"></i>
      <span id="toastMsg" class="font-medium font-sans">Success</span>
    </div>
  </div>

  <script>
    /* Web Audio API Synth (Romantic Arpeggio) */
    let audioCtx = null;
    let isPlaying = false;
    let audioTimer = null;
    let melodyIndex = 0;

    // Romantic arpeggio sequence notes
    const notes = [
      329.63, 392.00, 493.88, 587.33, 
      349.23, 440.00, 523.25, 659.25,
      293.66, 349.23, 440.00, 587.33,
      329.63, 493.88, 659.25, 783.99
    ];

    function playNote(freq) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 2.0);
      } catch (err) {
        console.error("Audio error:", err);
      }
    }

    function toggleAudio() {
      const musicIcon = document.getElementById('musicIcon');
      const musicBtn = document.getElementById('musicToggleBtn');

      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (isPlaying) {
        clearInterval(audioTimer);
        isPlaying = false;
        musicIcon.className = "fa-solid fa-music";
        musicBtn.classList.remove('bg-gold');
        musicBtn.classList.add('bg-burgundy/80');
      } else {
        isPlaying = true;
        musicIcon.className = "fa-solid fa-compact-disc animate-spin";
        musicBtn.classList.remove('bg-burgundy/80');
        musicBtn.classList.add('bg-gold');

        audioTimer = setInterval(() => {
          playNote(notes[melodyIndex % notes.length]);
          melodyIndex++;
        }, 700);
      }
    }

    /* Modal & Toast Logic */
    function openModal(id) {
      const modal = document.getElementById(id);
      if (modal) {
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      }
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (modal) {
        modal.classList.add('hidden');
        document.body.style.overflow = '';
      }
    }

    // Close on backdrop click
    document.querySelectorAll('.modal-backdrop').forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          closeModal(modal.id);
        }
      });
    });

    function handleRsvpSubmit(e) {
      e.preventDefault();
      const guestName = document.getElementById('guestName').value;
      const count = document.getElementById('guestCount').value;
      const attendance = document.querySelector('input[name="attendance"]:checked').value;
      
      closeModal('rsvpModal');
      
      let msg = '';
      if(attendance === 'Accepts') {
          msg = `RSVP saved! Looking forward to seeing ${guestName}.`;
      } else {
          msg = `Thank you for letting us know, ${guestName.split(' ')[0]}. You will be missed!`;
      }
      
      showToast(msg);
      document.getElementById('rsvpForm').reset();
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = message;

      toast.classList.remove('opacity-0', '-translate-y-24');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-24');
      }, 4000);
    }

    /* WhatsApp FAB Toggle */
    let isWaMenuOpen = false;
    function toggleWaMenu() {
      isWaMenuOpen = !isWaMenuOpen;
      const waMenu = document.getElementById('waMenu');
      const waMainIcon = document.getElementById('waMainIcon');
      
      if (isWaMenuOpen) {
        waMenu.classList.remove('opacity-0', 'translate-y-8', 'pointer-events-none');
        waMenu.classList.add('opacity-100', 'translate-y-0');
        waMainIcon.classList.add('rotate-45');
        waMainIcon.className = "fa-solid fa-xmark text-2xl transition-transform duration-300 rotate-90";
      } else {
        waMenu.classList.add('opacity-0', 'translate-y-8', 'pointer-events-none');
        waMenu.classList.remove('opacity-100', 'translate-y-0');
        waMainIcon.className = "fa-brands fa-whatsapp text-2xl transition-transform duration-300";
      }
    }
  </script>
</body>
</html>
